name: CI Pipeline

on:
  push:
    branches: [main, test-ci]  # 注意这里添加了逗号
  pull_request:
    branches: [main]
  workflow_dispatch:  # 启用手动触发

jobs:
  environment-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"