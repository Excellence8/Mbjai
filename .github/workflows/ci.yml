name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  environment-check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-dotenv

    - name: Prepare test environment
      shell: pwsh
      run: |
        # 打印调试信息
        Write-Host "当前目录: $(Get-Location)"
        Write-Host "PYTHONPATH: $env:PYTHONPATH"
        
        # 创建测试用.env文件
        Copy-Item .env.example .env -Force
        (Get-Content .env) -replace 'your_crawl4ai_key_here', 'test_key' | Set-Content .env
        (Get-Content .env) -replace 'jina_your_key_here', 'test_key' | Set-Content .env
        (Get-Content .env) -replace 'your_api_key_here', 'test_key' | Set-Content .env

        # 验证文件内容
        Write-Host ".env 文件内容："
        Get-Content .env

    - name: Run environment check
      shell: pwsh
      env:
        PYTHONUTF8: 1  # 关键环境变量
        PYTHONIOENCODING: utf-8
      run: |
        # 显式设置控制台编码
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        chcp 65001
        
        # 运行检查
        python -c "import os; print('当前工作目录:', os.getcwd())"
        python check_env.py